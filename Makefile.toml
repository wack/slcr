[config]
default_to_workspace = false

[env]
CARGO_MAKE_COVERAGE_PROVIDER = "llvm-cov"
CARGO_MAKE_CARGO_BUILD_TEST_FLAGS = ""
# This is the directory where we generate the CLI's reference
# documentation.
CLI_REFERENCE_DIR = "target/debug/"
# This is the name of the file containing the CLI's reference
# documentation.
CLI_REFERENCE_FILE_NAME = "reference.md"

[env.development]
CARGO_MAKE_EXTEND_WORKSPACE_MAKEFILE = true

[tasks.dev-test-flow]
dependencies = [
  "pre-build",
  "format-flow",
  "clippy-flow",
  "build",
  "post-build",
  "pre-docs",
  "docs",
  "post-docs",
  "test-flow",
  "test-doc",
  "test-gql",
]

# Canonical clippy command — the single source of truth shared by CI
# (ci-flow -> clippy-flow) and the bacon clippy job. Overrides cargo-make's
# built-in `clippy` task so both paths run the IDENTICAL command. `-- -D warnings`
# makes any clippy or rustc warning fail both CI and the bacon monitor, so a
# clean monitor run predicts a clean CI clippy run exactly. `workspace = false`
# is explicit (the command iterates the workspace itself via `--workspace`).
[tasks.clippy]
description = "Canonical clippy command — shared by CI (ci-flow) and bacon."
category = "Development"
workspace = false
command = "cargo"
args = [
  "clippy",
  "--all-targets",
  "--workspace",
  "--locked",
  "--",
  "-D",
  "warnings",
]

# `slcr-gql` (crates/gql) keeps two backends behind Cargo features that are
# off by default, so they rot unless CI also lints and tests them: the
# Grafeo differential oracle (tests/oracle.rs, `grafeo`) and the Turso store
# (src/store/turso_store.rs, `turso`). Each task is [tasks.clippy] for that
# crate alone plus its feature, kept separate so the feature sets stay
# independently attributable in CI output.
[tasks.clippy-grafeo]
description = "Canonical clippy command for slcr-gql's grafeo feature."
category = "Development"
workspace = false
command = "cargo"
args = [
  "clippy",
  "--all-targets",
  "--package",
  "slcr-gql",
  "--locked",
  "--features",
  "grafeo",
  "--",
  "-D",
  "warnings",
]

[tasks.clippy-turso]
description = "Canonical clippy command for slcr-gql's turso feature."
category = "Development"
workspace = false
command = "cargo"
args = [
  "clippy",
  "--all-targets",
  "--package",
  "slcr-gql",
  "--locked",
  "--features",
  "turso",
  "--",
  "-D",
  "warnings",
]

[tasks.ci-flow]
dependencies = [
  "pre-ci-flow",
  "print-env-flow",
  "pre-build",
  "check-format-flow",
  "clippy-flow",
  "build",
  "post-build",
  "pre-docs",
  "docs",
  "post-docs",
  "test-flow",
  "test-doc",
  "test-gql",
  "coverage-flow",
  "post-ci-flow",
]

# `slcr`'s suite alone: the workspace's default member is the root package.
# `slcr-gql` is tested by `test-gql`, since nextest can't run it.
[tasks.test]
workspace = false
description = "Run our test suite"
command = "cargo"
args = [
  "nextest",
  "run",
  "--locked",
  "@@remove-empty(CARGO_MAKE_CARGO_VERBOSE_FLAGS)",
  "@@split(CARGO_MAKE_CARGO_BUILD_TEST_FLAGS, )",
]

# Nextest doesn't run doctests, so the crate's documented examples are
# compiled here, in CI's flow after the suite, to keep them compiling.
[tasks.test-doc]
description = "Compile and run the documentation's examples."
category = "Test"
workspace = false
command = "cargo"
args = ["test", "--doc", "--locked"]

# `slcr-gql`'s suite (unit, profile, spec, doc examples, and the TCK gate)
# runs under the built-in libtest runner rather than cargo-nextest: the TCK
# gate (crates/gql/tests/tck, `harness = false`) has its own `main` and can't
# answer nextest's `--list` probe, so nextest refuses to run the suite at all.
[tasks.test-gql]
description = "Run slcr-gql's test suite, including the TCK gate."
category = "Test"
workspace = false
command = "cargo"
args = [
  "test",
  "--package",
  "slcr-gql",
  "--locked",
  "@@remove-empty(CARGO_MAKE_CARGO_VERBOSE_FLAGS)",
  "@@split(CARGO_MAKE_CARGO_BUILD_TEST_FLAGS, )",
]

# The same suite with the `grafeo` feature, which additionally runs the
# differential oracle against Grafeo. The oracle fails on any disagreement
# not triaged into KNOWN_DIVERGENCES, so this is a real gate.
[tasks.test-grafeo]
description = "Run slcr-gql's test suite with the grafeo feature (adds the Grafeo oracle)."
category = "Test"
workspace = false
command = "cargo"
args = [
  "test",
  "--package",
  "slcr-gql",
  "--locked",
  "--features",
  "grafeo",
  "@@remove-empty(CARGO_MAKE_CARGO_VERBOSE_FLAGS)",
  "@@split(CARGO_MAKE_CARGO_BUILD_TEST_FLAGS, )",
]

# The same suite with the `turso` feature, which adds tests/turso.rs (Turso
# vs the reference backend, persistence) and runs the TCK gate against an
# in-memory TursoStore (TCK_STORE=turso) instead of PetgraphStore, which
# `test-gql` already covers.
[tasks.test-turso]
description = "Run slcr-gql's test suite with the turso feature, with the TCK on TursoStore."
category = "Test"
workspace = false
env = { TCK_STORE = "turso" }
command = "cargo"
args = [
  "test",
  "--package",
  "slcr-gql",
  "--locked",
  "--features",
  "turso",
  "@@remove-empty(CARGO_MAKE_CARGO_VERBOSE_FLAGS)",
  "@@split(CARGO_MAKE_CARGO_BUILD_TEST_FLAGS, )",
]

# One task each for CI's grafeo and turso jobs (see on-merge.yml), kept out
# of `ci-flow` so they run as parallel jobs instead of serializing after it.
[tasks.ci-grafeo-flow]
dependencies = ["clippy-grafeo", "test-grafeo"]

[tasks.ci-turso-flow]
dependencies = ["clippy-turso", "test-turso"]

# The repository's own specification (see "Self-hosting" in CLAUDE.md).
# Both tasks run the checked-out `slcr`, never an installed one, so the
# result is the same in CI, in the pre-commit hook, and locally.
[tasks.render-expect-no-diff]
description = "Fail unless SPEC.md is exactly what SPEC.slcr.toml renders to."
category = "Development"
workspace = false
command = "cargo"
args = ["run", "--locked", "--", "render", "--expect-no-diff"]

# Needs cargo-insta and cargo-nextest, which the validators run.
[tasks.self-check]
description = "Run `slcr check` on the repository's own specification."
category = "Development"
workspace = false
command = "cargo"
args = ["run", "--locked", "--", "check", "--deny-warnings"]

[tasks.install-hooks]
description = "Have git run the repository's hooks, in .githooks/."
category = "Development"
workspace = false
command = "git"
args = ["config", "core.hooksPath", ".githooks"]

[tasks.help]
command = "cargo"
description = "List help text for the slcr executable"
category = "Development"
args = [
  "run",
  "@@remove-empty(CARGO_MAKE_CARGO_VERBOSE_FLAGS)",
  "@@split(CARGO_MAKE_CARGO_BUILD_TEST_FLAGS, )",
  "--",
  "--help",
]

[tasks.fmt]
workspace = true
alias = "format"

[tasks.check-format]
workspace = true

[tasks.wc]
description = "Calculate the LoC in src."
category = "Development"
command = "tokei"
args = ["."]

[tasks.gen-cli-reference]
description = "Generate the CLI's reference documentation in Markdown format"
category = "Development"
script_runner = "@shell"
script = '''
  mkdir -p $CLI_REFERENCE_DIR || true
  cargo run --bin mkdown-docs --features=markdown > $CLI_REFERENCE_DIR/$CLI_REFERENCE_FILE_NAME
'''

[tasks.bacon]
description = "Watch tests and rerun on file change."
category = "Development"
command = "bacon"
args = [
  "nextest",
  "--",
  "@@split(CARGO_MAKE_CARGO_BUILD_TEST_FLAGS, )",
]

[tasks.monitor]
description = "Run bacon headless for Claude Code's Monitor tool (no TTY, summary output on each change)."
category = "Development"
workspace = false
command = "bacon"
args = ["--headless", "--summary", "--no-help-line"]
