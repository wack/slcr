# Each validator proves one acceptance criterion of the library (the
# "Library" section of SPEC.slcr.toml) by running one test of this suite,
# the `library` integration target, with `cargo insta test`.
formatVersion = "1"

[[validator]]
requirement = "slcr/REQ-086"
criterion = "AC-215"
tool = "cargo-insta"
with = { target = "library", test = "documents_round_trip_in_their_canonical_form" }

