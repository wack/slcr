[package]
name = "slcr"
version = "0.1.0"
edition = "2024"

[dependencies]
directories = "6.0"
miette = { version = "7", features = ["fancy"] }
serde = { version = "1.0", features = ["derive"] }
serde-saphyr = "1.3"
serde_json = "1.0"
thiserror = "2.0"
toml = { version = "0.8.8", features = ["preserve_order"] }

[dev-dependencies]
figment = { version = "0.10", default-features = false, features = ["env", "test"] }

[lints.rust]
unsafe_code = "forbid"
