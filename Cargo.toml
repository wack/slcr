[package]
name = "slcr"
version = "0.2.0-rc.1"
edition = "2024"
# `description`, `homepage`, and `license` are the Homebrew formula's
# `desc`, `homepage`, and `license`, which `dist` generates from them.
description = "Write requirements as a graph and check them with validators"
homepage = "https://slcr.dev"
license = "MIT"
repository = "https://github.com/wack/slcr"
keywords = ["requirements", "specification", "validation", "cli"]
categories = ["command-line-utilities", "development-tools"]
# What crates.io gets: the library and the binary, without the test suites
# and their snapshots, or the repository's own specification and CI.
include = ["/src", "/README.md", "/LICENSE"]

# `slcr-gql`, the query engine, lives in `crates/gql`.
[workspace]
members = ["crates/gql"]

# What both packages depend on is declared once, here, and each takes it
# with `workspace = true`, so the two can't ask for different versions.
[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# The SLCR query profile (read-only GQL). The version is what a published
# `slcr` depends on, so keep it the crate's own.
slcr-gql = { version = "0.1.0", path = "crates/gql" }
thiserror = "2.0"

[[bin]]
name = "slcr"
path = "src/bin/main.rs"

[dependencies]
blake3 = "1.8.7"
clap = { version = "4", features = ["derive", "env"] }
console = "0.16"
derive-getters = "0.5"
directories = "6.0"
globset = "0.4.20"
ignore = "0.4.33"
jsonschema = { version = "0.58.6", default-features = false }
miette = { version = "7", features = ["fancy"] }
reqwest = { version = "0.13.5", default-features = false, features = [
  "rustls",
  "http2",
  "system-proxy",
] }
semver = "1.0.28"
serde.workspace = true
serde-saphyr = "1.3"
serde_json.workspace = true
slcr-gql.workspace = true
tempfile = "3"
thiserror.workspace = true
tokio = { version = "1", features = [
  "io-util",
  "process",
  "rt-multi-thread",
  "signal",
  "time",
] }
toml = { version = "0.8.8", features = ["preserve_order"] }
toml_edit = "0.22"
tracing = { version = "0.1.41", features = ["attributes"] }
tracing-subscriber = { version = "0.3.19", features = [
  "chrono",
  "fmt",
  "env-filter",
] }

# Killing a timed-out validator's whole process group through a safe API:
# the crate forbids `unsafe_code`, and std can only kill the direct child.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.5", default-features = false, features = [
  "process",
  "std",
] }

[dev-dependencies]
figment = { version = "0.10", default-features = false, features = [
  "env",
  "test",
] }
insta = { version = "1", features = ["filters", "redactions"] }
insta-cmd = "0.7"
pulldown-cmark = { version = "0.13", default-features = false }
rcgen = "0.14.10"
tokio = { version = "1", features = ["net", "io-util"] }
tokio-rustls = "0.26"

[lints.rust]
unsafe_code = "forbid"

# The profile `dist` builds release artifacts with.
[profile.dist]
inherits = "release"
lto = "thin"
