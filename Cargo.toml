[package]
name = "slcr"
version = "0.1.0"
edition = "2024"
repository = "https://github.com/wack/slcr"

[[bin]]
name = "slcr"
path = "src/bin/main.rs"

[dependencies]
blake3 = "1.8.7"
clap = { version = "4", features = ["derive", "env"] }
console = "0.16"
derive-getters = "0.5"
directories = "6.0"
jsonschema = { version = "0.58.6", default-features = false }
miette = { version = "7", features = ["fancy"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2", "system-proxy"] }
semver = "1.0.28"
serde = { version = "1.0", features = ["derive"] }
serde-saphyr = "1.3"
serde_json = "1.0"
# The SLCR query profile (read-only GQL). Not on crates.io; pinned to a
# reviewed commit of wack/gql-rust.
slcr-gql = { git = "https://github.com/wack/gql-rust", rev = "e505107aced5501c80ee850701dfeff1c5ef079c" }
tempfile = "3"
thiserror = "2.0"
tokio = { version = "1", features = ["rt-multi-thread"] }
toml = { version = "0.8.8", features = ["preserve_order"] }
toml_edit = "0.22"
tracing = { version = "0.1.41", features = ["attributes"] }
tracing-subscriber = { version = "0.3.19", features = ["chrono", "fmt", "env-filter"] }

[dev-dependencies]
figment = { version = "0.10", default-features = false, features = ["env", "test"] }
insta = { version = "1", features = ["filters"] }
insta-cmd = "0.7"
pulldown-cmark = { version = "0.13", default-features = false }
rcgen = "0.14.10"
tokio = { version = "1", features = ["net", "io-util"] }
tokio-rustls = "0.26"

[lints.rust]
unsafe_code = "forbid"

# The profile `dist` builds release artifacts with.
[profile.dist]
inherits = "release"
lto = "thin"
