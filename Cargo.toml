[package]
name = "slcr"
version = "0.1.0"
edition = "2024"
repository = "https://github.com/wack/slcr"

[[bin]]
name = "slcr"
path = "src/bin/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
console = "0.16"
derive-getters = "0.5"
directories = "6.0"
miette = { version = "7", features = ["fancy"] }
serde = { version = "1.0", features = ["derive"] }
serde-saphyr = "1.3"
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1", features = ["rt-multi-thread"] }
toml = { version = "0.8.8", features = ["preserve_order"] }
tracing = { version = "0.1.41", features = ["attributes"] }
tracing-subscriber = { version = "0.3.19", features = ["chrono", "fmt", "env-filter"] }

[dev-dependencies]
figment = { version = "0.10", default-features = false, features = ["env", "test"] }

[lints.rust]
unsafe_code = "forbid"

# The profile `dist` builds release artifacts with.
[profile.dist]
inherits = "release"
lto = "thin"
